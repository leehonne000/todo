<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记录编辑 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ECEAE4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 12px;
    gap: 14px;
  }
  .phone {
    width: 375px;
    height: 748px;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    color: #fff;
    box-shadow: 0 18px 48px rgba(20, 24, 32, 0.28);
    flex: none;
  }
  .bg {
    position: absolute;
    inset: 0;
    background-image: url('../pics/background/太空/Nebula__hlmflgnnmmojlnbmaokpfcjdkhkjbnok.png');
    background-size: cover;
    background-position: center;
  }
  .scrim { position: absolute; inset: 0; background: rgba(10, 10, 26, 0.42); }
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 26px 18px 20px;
    overflow-y: auto;
  }
  .content::-webkit-scrollbar { width: 0; }

  .glass {
    background: rgba(255, 255, 255, 0.13);
    border: 1px solid rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  /* 顶栏：返回 + 类型徽标（类型由入口按钮定死，只展示不可改） */
  .top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .back {
    width: 38px; height: 38px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #fff;
    flex: none;
  }
  .back svg { width: 18px; height: 18px; }
  .top-title { font-size: 17px; font-weight: 600; letter-spacing: 1px; }
  .badge {
    font-size: 10.5px;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 7px;
    color: #fff;
  }
  .badge.note { background: rgba(255, 255, 255, 0.22); }
  .badge.wrong { background: #FAC775; color: #241c08; font-weight: 600; }

  .sec-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.55);
    margin: 16px 2px 8px;
  }
  .sec-label:first-of-type { margin-top: 2px; }

  /* 文字内容 */
  .content-box {
    border-radius: 14px;
    padding: 14px 15px;
    min-height: 148px;
  }
  .content-box textarea {
    width: 100%;
    min-height: 120px;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: #fff;
    font-size: 14.5px;
    line-height: 1.75;
    font-family: inherit;
  }
  .content-box textarea::placeholder { color: rgba(255, 255, 255, 0.38); }

  /* 图片 */
  .imgs { display: flex; flex-wrap: wrap; gap: 9px; }
  .img-add {
    width: 72px; height: 72px;
    border-radius: 11px;
    border: 1.5px dashed rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.06);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.55);
    font-size: 10px;
    transition: border-color 0.14s ease;
  }
  .img-add:active { border-color: #FAC775; }
  .img-add .plus { font-size: 20px; font-weight: 300; }
  .img-item {
    position: relative;
    width: 72px; height: 72px;
    border-radius: 11px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.12);
    flex: none;
  }
  .img-item .thumb {
    width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
  }
  .img-item .del {
    position: absolute;
    top: 3px; right: 3px;
    width: 19px; height: 19px;
    border-radius: 50%;
    background: rgba(20, 20, 30, 0.72);
    color: #fff;
    font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    border: none;
  }
  .img-count {
    margin-left: auto;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 0.5px;
    font-variant-numeric: tabular-nums;
  }

  /* 标签 */
  .tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tag {
    display: flex; align-items: center; gap: 6px;
    height: 30px;
    padding: 0 11px;
    border-radius: 999px;
    background: #FAC775;
    color: #241c08;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .tag .x {
    cursor: pointer;
    font-size: 13px;
    opacity: 0.65;
    line-height: 1;
  }
  .tag .x:hover { opacity: 1; }
  .tag-add {
    height: 30px;
    padding: 0 13px;
    border-radius: 999px;
    border: 1px dashed rgba(255, 255, 255, 0.4);
    background: transparent;
    color: rgba(255, 255, 255, 0.7);
    font-size: 12.5px;
    cursor: pointer;
    display: flex; align-items: center; gap: 4px;
  }
  .tag-input {
    height: 30px;
    width: 132px;
    padding: 0 13px;
    border-radius: 999px;
    border: 1px solid rgba(250, 199, 117, 0.75);
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font-size: 12.5px;
    outline: none;
    font-family: inherit;
  }
  .tag-input::placeholder { color: rgba(255, 255, 255, 0.4); }

  .foot {
    margin-top: auto;
    padding-top: 18px;
    display: flex;
    justify-content: flex-end;
  }
  .done {
    min-width: 112px;
    height: 50px;
    padding: 0 26px;
    border: none;
    border-radius: 999px;
    background: #FAC775;
    color: #241c08;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(250, 199, 117, 0.35);
    transition: transform 0.14s ease;
  }
  .done:active { transform: scale(0.95); }

  .hint {
    font-size: 12px;
    color: #7a776f;
    text-align: center;
    max-width: 420px;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="bg"></div>
  <div class="scrim"></div>

  <div class="content">
    <div class="top">
      <div class="back glass" onclick="save(false)" title="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 5 8 12 15 19"></polyline>
        </svg>
      </div>
      <div class="top-title" id="topTitle">添加note</div>
      <span class="badge" id="typeBadge">note</span>
    </div>

    <div class="sec-label">文字内容（可空，允许纯图片）</div>
    <div class="content-box glass">
      <textarea id="contentInput" placeholder="写点什么……也可以只拍照"></textarea>
    </div>

    <div class="sec-label">
      图片
      <span class="img-count" id="imgCount">0 / 10</span>
    </div>
    <div class="imgs" id="imgs">
      <div class="img-add" onclick="addImage()">
        <span class="plus">＋</span>
        <span>相册/拍照</span>
      </div>
    </div>

    <div class="sec-label">自定义标签</div>
    <div class="tags" id="tags">
      <button class="tag-add" id="tagAddBtn" onclick="showTagInput()">＋ 标签</button>
    </div>

    <div class="foot">
      <button class="done" onclick="save(true)">完成</button>
    </div>
  </div>
</div>

<p class="hint">Demo 5 · 记录编辑（点「添加note/添加错题」进入）—— <b>无科目选项卡、无类型二选一</b>（都已在外层定死）；只有文字 / 图片(≤10) / 标签。点「完成」回总结页挂子条目</p>

<script>
  var params = new URLSearchParams(location.search);
  var index = parseInt(params.get('index'), 10);
  var entries = JSON.parse(localStorage.getItem('demo_entries') || '[]');
  var entry = entries[index] || { type: 'note', content: '', tags: [], images: [] };

  var isEdit = entries[index] !== undefined;

  // 顶部：类型由入口定死（只读展示）
  var isWrong = entry.type === 'wrong';
  document.getElementById('topTitle').textContent = isEdit ? (isWrong ? '编辑错题' : '编辑note') : (isWrong ? '添加错题' : '添加note');
  var badge = document.getElementById('typeBadge');
  badge.textContent = isWrong ? '错题' : 'note';
  badge.className = 'badge ' + (isWrong ? 'wrong' : 'note');

  // 文字
  var contentInput = document.getElementById('contentInput');
  contentInput.value = entry.content || '';

  // 图片（demo：点击加一张占位图，模拟压缩后的 webp）
  var PLACEHOLDER = [
    'linear-gradient(135deg, #5a7fa8, #8fb8d8)',
    'linear-gradient(135deg, #7a6bb5, #a89fd8)',
    'linear-gradient(135deg, #b58a6b, #d8b89f)',
    'linear-gradient(135deg, #6bb58a, #9fd8b8)',
    'linear-gradient(135deg, #b56b6b, #d89f9f)'
  ];
  renderImages();
  function renderImages() {
    var box = document.getElementById('imgs');
    box.querySelectorAll('.img-item').forEach(function (n) { n.remove(); });
    entry.images.forEach(function (img, i) {
      var item = document.createElement('div');
      item.className = 'img-item';
      item.innerHTML =
        '<div class="thumb" style="background:' + (img.css || PLACEHOLDER[i % PLACEHOLDER.length]) + '"></div>' +
        '<button class="del" title="删除">×</button>';
      item.querySelector('.del').onclick = function () {
        entry.images.splice(i, 1);
        renderImages();
      };
      box.appendChild(item);
    });
    document.getElementById('imgCount').textContent = entry.images.length + ' / 10';
  }
  function addImage() {
    if (entry.images.length >= 10) return;
    entry.images.push({});
    renderImages();
  }

  // 标签
  renderTags();
  function renderTags() {
    var box = document.getElementById('tags');
    box.querySelectorAll('.tag').forEach(function (n) { n.remove(); });
    entry.tags.forEach(function (t, i) {
      var chip = document.createElement('div');
      chip.className = 'tag';
      chip.innerHTML = '<span>' + escapeHtml(t) + '</span><span class="x" title="删除">×</span>';
      chip.querySelector('.x').onclick = function () {
        entry.tags.splice(i, 1);
        renderTags();
      };
      box.insertBefore(chip, document.getElementById('tagAddBtn'));
    });
  }
  function showTagInput() {
    var btn = document.getElementById('tagAddBtn');
    if (document.getElementById('tagInput')) return;
    var input = document.createElement('input');
    input.className = 'tag-input';
    input.id = 'tagInput';
    input.placeholder = '输入后回车';
    btn.style.display = 'none';
    btn.parentNode.insertBefore(input, btn);
    input.focus();
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var v = input.value.trim();
        if (v && entry.tags.indexOf(v) === -1 && entry.tags.length < 10) {
          entry.tags.push(v);
        }
        input.remove();
        btn.style.display = '';
        renderTags();
      } else if (e.key === 'Escape') {
        input.remove();
        btn.style.display = '';
      }
    });
    input.addEventListener('blur', function () {
      if (input.parentNode) {
        input.remove();
        btn.style.display = '';
      }
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 完成 / 返回：demo 校验"文字与图片至少一"
  function save(fromDone) {
    entry.content = contentInput.value;
    if (fromDone && !entry.content.trim() && !entry.images.length) {
      alert('文字与图片至少有一');
      return;
    }
    if (!isEdit && !entry.content.trim() && !entry.images.length && !entry.tags.length) {
      // 空白新条目直接返回则丢弃
      entries.splice(index, 1);
    } else {
      entries[index] = entry;
    }
    localStorage.setItem('demo_entries', JSON.stringify(entries));
    location.href = 'demo_4_summary.html';
  }
</script>

</body>
</html>
