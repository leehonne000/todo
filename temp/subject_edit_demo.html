<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科目编辑界面 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ECEAE4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 12px;
    gap: 14px;
  }
  .phone {
    width: 375px;
    height: 748px;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    color: #fff;
    box-shadow: 0 18px 48px rgba(20, 24, 32, 0.28);
    flex: none;
  }
  .bg {
    position: absolute;
    inset: 0;
    background-image: url('../pics/background/太空/Nebula__hlmflgnnmmojlnbmaokpfcjdkhkjbnok.png');
    background-size: cover;
    background-position: center;
  }
  .scrim { position: absolute; inset: 0; background: rgba(10, 10, 26, 0.42); }
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 26px 18px 20px;
    overflow-y: auto;
  }
  .content::-webkit-scrollbar { width: 0; }

  .sec-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.55);
    margin: 14px 2px 8px;
  }
  .sec-label:first-child { margin-top: 2px; }

  .glass {
    background: rgba(255, 255, 255, 0.13);
    border: 1px solid rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .subject-bar {
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    font-size: 15px;
    cursor: pointer;
  }
  .subject-bar .sb-text { color: rgba(255, 255, 255, 0.55); }
  .subject-bar .sb-text.set { color: #fff; font-weight: 500; }
  .subject-bar .chev { font-size: 13px; color: rgba(255, 255, 255, 0.55); }
  .subject-options {
    display: none;
    margin-top: 3px;
    margin-left: 26px;
    width: 82%;
    border-radius: 0 0 12px 12px;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-top: none;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    overflow: hidden;
  }
  .opt {
    height: 38px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 13px;
    cursor: pointer;
  }
  .opt + .opt { border-top: 1px solid rgba(255, 255, 255, 0.12); }
  .opt .dot {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.5);
    box-sizing: border-box;
    flex: none;
  }
  .opt.on .dot { background: #FAC775; border: 4px solid rgba(255, 255, 255, 0.92); }
  .opt .name { font-size: 12px; color: rgba(255, 255, 255, 0.9); }
  .opt.on .name { color: #FAC775; }

  textarea {
    width: 100%;
    min-height: 116px;
    resize: none;
    border-radius: 14px;
    padding: 13px 14px;
    font-size: 14px;
    line-height: 1.65;
    color: #fff;
    background: rgba(255, 255, 255, 0.13);
    border: 1px solid rgba(255, 255, 255, 0.22);
    outline: none;
    font-family: inherit;
  }
  textarea::placeholder { color: rgba(255, 255, 255, 0.45); }
  textarea:focus { border-color: rgba(250, 199, 117, 0.7); }

  .img-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .add-img {
    width: 72px;
    height: 72px;
    border-radius: 12px;
    border: 1px dashed rgba(255, 255, 255, 0.42);
    background: rgba(255, 255, 255, 0.07);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 200;
    color: rgba(255, 255, 255, 0.85);
    cursor: pointer;
    flex: none;
  }
  .thumb {
    position: relative;
    width: 72px;
    height: 72px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.25);
    flex: none;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .x {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 11px;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
  }

  .tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 11px;
    border-radius: 999px;
    background: rgba(250, 199, 117, 0.18);
    border: 1px solid rgba(250, 199, 117, 0.55);
    font-size: 12px;
    color: #FAC775;
  }
  .tag .x { cursor: pointer; font-size: 13px; color: rgba(250, 199, 117, 0.75); }
  .tag-add {
    display: flex;
    align-items: center;
    height: 30px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px dashed rgba(255, 255, 255, 0.42);
    background: rgba(255, 255, 255, 0.07);
    font-size: 12px;
    color: rgba(255, 255, 255, 0.85);
    cursor: pointer;
  }
  .tag-input {
    height: 30px;
    width: 128px;
    padding: 0 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.13);
    border: 1px solid rgba(250, 199, 117, 0.6);
    outline: none;
    font-size: 12px;
    color: #fff;
  }
  .tag-input::placeholder { color: rgba(255, 255, 255, 0.45); }

  .foot {
    margin-top: auto;
    padding-top: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cancel {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.75);
    font-size: 14px;
    cursor: pointer;
    padding: 10px 6px;
  }
  .done {
    min-width: 112px;
    height: 50px;
    padding: 0 26px;
    border: none;
    border-radius: 999px;
    background: #FAC775;
    color: #241c08;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(250, 199, 117, 0.35);
  }
  .done:active { transform: scale(0.96); }

  .toast {
    position: absolute;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%) translateY(12px);
    max-width: 300px;
    padding: 11px 16px;
    border-radius: 999px;
    background: rgba(16, 18, 24, 0.88);
    color: #fff;
    font-size: 12px;
    line-height: 1.6;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hint {
    font-size: 12px;
    color: #7a776f;
    text-align: center;
    max-width: 375px;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="bg"></div>
  <div class="scrim"></div>

  <div class="content">
    <div class="subject-bar glass" id="subjectBar">
      <span class="sb-text" id="sbText">科目</span>
      <span class="chev" id="sbChev">▾</span>
    </div>
    <div class="subject-options" id="subjectOptions">
      <div class="opt" data-s="政治"><div class="dot"></div><div class="name">政治</div></div>
      <div class="opt" data-s="英语一"><div class="dot"></div><div class="name">英语一</div></div>
      <div class="opt" data-s="数学三"><div class="dot"></div><div class="name">数学三</div></div>
      <div class="opt" data-s="计算机学科专业基础综合(408)"><div class="dot"></div><div class="name">计算机学科专业基础综合(408)</div></div>
    </div>

    <div class="sec-label">内容</div>
    <textarea id="text" placeholder="记下今天的内容、结论或错题……"></textarea>

    <div class="sec-label">图片</div>
    <div class="img-row" id="imgRow">
      <div class="add-img" id="addImg">＋</div>
    </div>
    <input type="file" id="imgInput" accept="image/*" multiple hidden>

    <div class="sec-label">标签 · 自定义</div>
    <div class="tags" id="tags">
      <div class="tag">易错<span class="x">×</span></div>
      <div class="tag-add" id="tagAdd">＋ 标签</div>
    </div>

    <div class="foot">
      <button class="cancel" id="cancelBtn">取消</button>
      <button class="done" id="doneBtn">完成</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<p class="hint">
  Demo · 科目编辑界面 —— 点「科目」选项卡展开四选一、选中后自动折叠并显示科目名；
  编辑文字、点「＋」插图（电脑上传 / 手机拍照相册）、自定义标签（点「＋标签」输入，回车添加），完成后回到学习总结页
</p>

<script>
  var images = [];

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.innerHTML = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  var subjectBar = document.getElementById('subjectBar');
  var subjectOptions = document.getElementById('subjectOptions');
  var sbText = document.getElementById('sbText');
  var sbChev = document.getElementById('sbChev');

  function setOpen(v) {
    subjectOptions.style.display = v ? 'block' : 'none';
    sbChev.textContent = v ? '▴' : '▾';
  }
  subjectBar.addEventListener('click', function () {
    setOpen(subjectOptions.style.display !== 'block');
  });
  subjectOptions.addEventListener('click', function (e) {
    var row = e.target.closest('.opt');
    if (!row) return;
    this.querySelectorAll('.opt').forEach(function (r) { r.classList.remove('on'); });
    row.classList.add('on');
    sbText.textContent = row.getAttribute('data-s');
    sbText.classList.add('set');
    setOpen(false);
  });

  var imgInput = document.getElementById('imgInput');
  document.getElementById('addImg').addEventListener('click', function () { imgInput.click(); });

  imgInput.addEventListener('change', function () {
    Array.prototype.forEach.call(imgInput.files, function (f) {
      if (images.length >= 6) return;
      images.push({ url: URL.createObjectURL(f) });
    });
    imgInput.value = '';
    renderImgs();
  });

  function renderImgs() {
    var row = document.getElementById('imgRow');
    row.innerHTML = '<div class="add-img" id="addImg">＋</div>' +
      images.map(function (im, i) {
        return '<div class="thumb"><img src="' + im.url + '"><div class="x" data-i="' + i + '">✕</div></div>';
      }).join('');
    document.getElementById('addImg').addEventListener('click', function () { imgInput.click(); });
  }

  document.getElementById('imgRow').addEventListener('click', function (e) {
    var x = e.target.closest('.x');
    if (!x) return;
    images.splice(parseInt(x.getAttribute('data-i'), 10), 1);
    renderImgs();
  });

  var tags = document.getElementById('tags');
  document.getElementById('tagAdd').addEventListener('click', function () {
    var input = document.createElement('input');
    input.className = 'tag-input';
    input.placeholder = '输入后回车';
    tags.insertBefore(input, this);
    this.style.display = 'none';
    input.focus();
    function commit() {
      var v = input.value.trim();
      if (v) {
        var tag = document.createElement('div');
        tag.className = 'tag';
        tag.innerHTML = v.replace(/</g, '&lt;') + '<span class="x">×</span>';
        tags.insertBefore(tag, input);
      }
      input.remove();
      document.getElementById('tagAdd').style.display = 'flex';
    }
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') { input.remove(); document.getElementById('tagAdd').style.display = 'flex'; }
    });
    input.addEventListener('blur', commit);
  });

  tags.addEventListener('click', function (e) {
    var x = e.target.closest('.tag .x');
    if (!x) return;
    x.parentNode.remove();
  });

  document.getElementById('cancelBtn').addEventListener('click', function () {
    showToast('已放弃编辑（demo 示意）');
  });

  document.getElementById('doneBtn').addEventListener('click', function () {
    var on = document.querySelector('.opt.on .name');
    if (!on) {
      setOpen(true);
      showToast('先点上方「科目」选一个科目');
      return;
    }
    var subject = on.textContent;
    var tagList = Array.prototype.map.call(document.querySelectorAll('.tag'), function (t) {
      return t.textContent.replace('×', '').trim();
    });
    showToast('已保存 ·「' + subject + '」· 图片 ' + images.length + ' 张' +
      (tagList.length ? ' · 标签 ' + tagList.join('、') : '') + '，返回学习总结');
  });
</script>
</body>
</html>
