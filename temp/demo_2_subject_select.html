<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选择科目 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ECEAE4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 12px;
    gap: 14px;
  }
  .phone {
    width: 375px;
    height: 748px;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    color: #fff;
    box-shadow: 0 18px 48px rgba(20, 24, 32, 0.28);
    flex: none;
  }
  .bg {
    position: absolute;
    inset: 0;
    background-image: url('../pics/background/太空/Nebula__hlmflgnnmmojlnbmaokpfcjdkhkjbnok.png');
    background-size: cover;
    background-position: center;
  }
  .scrim { position: absolute; inset: 0; background: rgba(10, 10, 26, 0.42); }
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 28px 18px 22px;
  }
  .glass {
    background: rgba(255, 255, 255, 0.13);
    border: 1px solid rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .back {
    width: 38px; height: 38px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #fff;
  }
  .back svg { width: 18px; height: 18px; }

  .title {
    margin-top: 26px;
    font-size: 25px;
    font-weight: 650;
    letter-spacing: 1.5px;
  }
  .subtitle {
    margin-top: 9px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 0.4px;
    line-height: 1.7;
  }

  .list {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .subject {
    height: 62px;
    border-radius: 16px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 0.14s ease, background 0.14s ease;
  }
  .subject:active { transform: scale(0.97); background: rgba(250, 199, 117, 0.22); }
  .subject .s-name {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .subject .s-tag {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
    letter-spacing: 1px;
    margin-right: 10px;
    flex: none;
  }
  .subject .s-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .subject .chev {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.55);
  }

  .hint {
    font-size: 12px;
    color: #7a776f;
    text-align: center;
    max-width: 420px;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="bg"></div>
  <div class="scrim"></div>

  <div class="content">
    <div class="back glass" onclick="location.href='demo_1_main.html'" title="返回主界面">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 5 8 12 15 19"></polyline>
      </svg>
    </div>

    <div class="title">今天学哪门？</div>
    <div class="subtitle">一次只学一门 · 本次学习的记录都会挂到所选科目下</div>

    <div class="list" id="list"></div>
  </div>
</div>

<p class="hint">Demo 2 · 选择科目（点 Learn 卡片后进入）—— 点任意科目 → 横屏计时界面</p>

<script>
  // 注册时确定的科目组合（demo 数据）
  var subjects = ['政治', '英语一', '数学三', '计算机学科专业基础综合(408)'];
  var listEl = document.getElementById('list');

  subjects.forEach(function (name) {
    var row = document.createElement('div');
    row.className = 'subject glass';
    row.innerHTML =
      '<div class="s-name">' + name + '</div>' +
      '<div class="s-right"><span class="s-tag">选择</span><span class="chev">›</span></div>';
    row.onclick = function () {
      localStorage.setItem('demo_subject', JSON.stringify(name));
      localStorage.setItem('demo_entries', JSON.stringify([]));
      localStorage.setItem('demo_duration', JSON.stringify(0));
      location.href = 'demo_3_timer.html';
    };
    listEl.appendChild(row);
  });
</script>

</body>
</html>
