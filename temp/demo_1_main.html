<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主界面 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ECEAE4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 12px;
    gap: 14px;
  }
  .phone {
    width: 375px;
    height: 748px;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    color: #fff;
    box-shadow: 0 18px 48px rgba(20, 24, 32, 0.28);
    flex: none;
  }
  .bg {
    position: absolute;
    inset: 0;
    background-image: url('../pics/background/太空/Nebula__hlmflgnnmmojlnbmaokpfcjdkhkjbnok.png');
    background-size: cover;
    background-position: center;
  }
  .scrim { position: absolute; inset: 0; background: rgba(10, 10, 26, 0.42); }
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 22px 18px 12px;
  }
  .glass {
    background: rgba(255, 255, 255, 0.13);
    border: 1px solid rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  /* 顶栏 */
  .top { display: flex; align-items: center; justify-content: space-between; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #8fb8d8, #5a7fa8);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600; color: #fff;
    border: 1.5px solid rgba(255,255,255,0.35);
  }
  .q-btn {
    width: 40px; height: 40px; border-radius: 12px;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
  }
  .q-btn svg { width: 19px; height: 19px; }

  /* 签到卡 */
  .checkin {
    margin: 78px auto 0;
    width: 152px; height: 138px;
    border-radius: 22px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 9px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .checkin:active { transform: scale(0.96); }
  .checkin svg { width: 30px; height: 30px; opacity: 0.92; }
  .checkin .c-label { font-size: 17px; font-weight: 500; letter-spacing: 2px; }
  .checkin .c-date { font-size: 13px; color: rgba(255,255,255,0.62); letter-spacing: 0.5px; }
  .checkin.done .c-label { color: #FAC775; }

  /* Learn / Review 卡 */
  .cards { margin-top: auto; display: flex; gap: 14px; }
  .card {
    flex: 1;
    border-radius: 18px;
    padding: 16px 16px 14px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .card:active { transform: scale(0.97); }
  .card .c-title { font-size: 17px; font-weight: 600; letter-spacing: 0.4px; }
  .card .c-num {
    margin-top: 6px;
    font-size: 19px; font-weight: 600;
    color: #FAC775; letter-spacing: 0.5px;
    min-height: 24px;
    display: flex; align-items: center; gap: 6px;
  }
  .card .c-num .tick { font-size: 15px; }

  /* 底部导航 */
  .nav {
    margin-top: 16px;
    display: flex; justify-content: space-around; align-items: center;
    padding: 6px 8px 2px;
  }
  .nav .n-item {
    width: 44px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0.85;
  }
  .nav svg { width: 22px; height: 22px; }

  .toast {
    position: absolute; left: 50%; top: 46%;
    transform: translate(-50%, -50%) scale(0.94);
    background: rgba(20, 20, 34, 0.82);
    color: #fff; font-size: 13px;
    padding: 11px 18px; border-radius: 12px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .hint {
    font-size: 12px;
    color: #7a776f;
    text-align: center;
    max-width: 420px;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="bg"></div>
  <div class="scrim"></div>

  <div class="content">
    <div class="top">
      <div class="avatar">L</div>
      <button class="q-btn glass" onclick="toast('标签查询 demo 未覆盖')" title="标签查询">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
      </button>
    </div>

    <div class="checkin glass" id="checkin" onclick="toggleCheckin()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="3" y="5" width="18" height="16" rx="3"></rect>
        <line x1="3" y1="10" x2="21" y2="10"></line>
        <line x1="8" y1="3" x2="8" y2="7"></line>
        <line x1="16" y1="3" x2="16" y2="7"></line>
      </svg>
      <div class="c-label" id="checkinLabel">签到</div>
      <div class="c-date" id="checkinDate"></div>
    </div>

    <div class="cards">
      <div class="card glass" onclick="startLearn()">
        <div class="c-title">Learn</div>
        <div class="c-num" id="learnNum">0</div>
      </div>
      <div class="card glass" onclick="toast('艾宾浩斯队列 demo 未覆盖')">
        <div class="c-title">Review</div>
        <div class="c-num">3</div>
      </div>
    </div>

    <div class="nav">
      <div class="n-item" onclick="toast('信息模块 demo 未覆盖')" title="信息模块">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 9l10-5 10 5-10 5z"></path>
          <path d="M6 11.5V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.5"></path>
        </svg>
      </div>
      <div class="n-item" onclick="toast('复习模块（自由库）demo 未覆盖')" title="复习模块">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="18" height="13" rx="2.5"></rect>
          <path d="M3 11h18"></path>
          <path d="M8 7V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V7"></path>
        </svg>
      </div>
      <div class="n-item" onclick="toast('进度模块 demo 未覆盖')" title="进度模块">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"></rect>
          <polyline points="7 15 10 11 13 13.5 17 8"></polyline>
        </svg>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<p class="hint">Demo 1 · 主界面 —— 点左下 <b>Learn</b> 卡片进入「选择科目」；签到卡可点；查询图标 / Review / 底部三模块暂未覆盖</p>

<script>
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { localStorage.setItem(k, JSON.stringify(v)); }
  };

  // 日期：10/24 Sat.
  (function () {
    var d = new Date();
    var wk = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    document.getElementById('checkinDate').textContent =
      p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + wk[d.getDay()] + '.';
  })();

  // 签到状态
  var checked = store.get('demo_checked', false);
  renderCheckin();
  function renderCheckin() {
    var el = document.getElementById('checkin');
    var lb = document.getElementById('checkinLabel');
    el.classList.toggle('done', checked);
    lb.textContent = checked ? '已签到 ✓' : '签到';
  }
  function toggleCheckin() {
    checked = !checked;
    store.set('demo_checked', checked);
    renderCheckin();
  }

  // 今日学习卡状态：学过显示 ✓
  var learned = store.get('demo_learned', false);
  renderLearn();
  function renderLearn() {
    var el = document.getElementById('learnNum');
    el.innerHTML = learned ? '<span class="tick">✓</span> 今天学过' : '0';
  }

  // 点 Learn → 选择科目（新一轮清空旧总结）
  function startLearn() {
    store.set('demo_subject', null);
    store.set('demo_entries', []);
    store.set('demo_duration', 0);
    location.href = 'demo_2_subject_select.html';
  }

  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1400);
  }
</script>

</body>
</html>
