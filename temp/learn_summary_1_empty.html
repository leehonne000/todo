<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习总结 · 空态</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ECEAE4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 12px;
    gap: 14px;
  }
  .phone {
    width: 375px;
    height: 748px;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    color: #fff;
    box-shadow: 0 18px 48px rgba(20, 24, 32, 0.28);
    flex: none;
  }
  .bg {
    position: absolute;
    inset: 0;
    background-image: url('../pics/background/太空/Nebula__hlmflgnnmmojlnbmaokpfcjdkhkjbnok.png');
    background-size: cover;
    background-position: center;
  }
  .scrim { position: absolute; inset: 0; background: rgba(10, 10, 26, 0.42); }
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 30px 18px 20px;
  }
  .subject-btn {
    height: 56px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.13);
    border: 1px solid rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 15px;
    color: #fff;
    letter-spacing: 0.5px;
  }
  .foot {
    margin-top: auto;
    display: flex;
    justify-content: flex-end;
  }
  .done {
    min-width: 112px;
    height: 50px;
    padding: 0 26px;
    border: none;
    border-radius: 999px;
    background: #FAC775;
    color: #241c08;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(250, 199, 117, 0.35);
  }
  .hint {
    font-size: 12px;
    color: #7a776f;
    text-align: center;
    max-width: 375px;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="bg"></div>
  <div class="scrim"></div>

  <div class="content">
    <div class="subject-btn">
      <span style="font-size: 18px; font-weight: 300;">＋</span>
      <span>添加科目</span>
    </div>

    <div class="foot">
      <button class="done">Done</button>
    </div>
  </div>
</div>

<p class="hint">Demo 1 · 刚进入学习总结（空态）—— 界面只有「添加科目」和「Done」两个框</p>

</body>
</html>
