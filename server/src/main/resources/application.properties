spring.application.name=exam-timeline
server.port=8080

# --- MySQL (local dev; docker compose 的 MySQL 起来后即为该地址) ---
spring.datasource.url=jdbc:mysql://localhost:3306/exam_timeline?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=exam
spring.datasource.password=exam_dev_2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
# v1 开发阶段用 update 自动建表；表设计定稿后可切 validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# --- 文件上传（图片，v1 存本地磁盘） ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
