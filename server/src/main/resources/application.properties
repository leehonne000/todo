spring.application.name=exam-timeline
server.port=8080

# --- MySQL (local dev; docker 容器 exam-mysql 映射 3307——本机 3306 被 Windows MySQL 服务占用) ---
# characterEncoding 填 Java 字符集名 UTF-8（驱动不认 MySQL 的 utf8mb4 写法），库/表本身仍是 utf8mb4
spring.datasource.url=jdbc:mysql://localhost:3307/exam_timeline?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
# v1 开发阶段用 update 自动建表；表设计定稿后可切 validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# --- 文件上传（图片）---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# --- MinIO 对象存储（图片本体；私有桶 exam-timeline + 预签名 GET，契约 §10）---
# 镜像分发注意：MinIO 2025-10 起停发 Docker Hub 免费镜像，本地/部署取镜像方案见 docs/开发进度.md 2026-10-26
# endpoint=后端访问 MinIO 的地址（容器内网 http://minio:9000）；
# presign-endpoint=预签名 URL 里的 host（浏览器可达地址；空=回退 endpoint，本地开发用）——部署路线②，见开发进度「二十八」
app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.presign-endpoint=${MINIO_PRESIGN_ENDPOINT:}
app.minio.access-key=${MINIO_ROOT_USER}
app.minio.secret-key=${MINIO_ROOT_PASSWORD}
app.minio.bucket=exam-timeline
app.minio.presign-ttl-hours=12

# --- Jackson：时间戳输出 ISO-8601 文本（契约 §1.1：2026-10-24T18:30:00）---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Mail（QQ 邮箱 SMTP，注册激活/找回密码发验证码）---
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- JWT ---
app.jwt.secret=${JWT_SECRET:exam-timeline-dev-secret-change-me-in-prod-please-32bytes}
app.jwt.expire-hours=168
