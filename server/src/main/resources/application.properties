spring.application.name=exam-timeline
server.port=8080

# --- MySQL (local dev; docker 容器 exam-mysql 映射 3307——本机 3306 被 Windows MySQL 服务占用) ---
spring.datasource.url=jdbc:mysql://localhost:3307/exam_timeline?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
# v1 开发阶段用 update 自动建表；表设计定稿后可切 validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# --- 文件上传（图片，v1 存本地磁盘） ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
