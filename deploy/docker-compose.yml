# Big Tree 部署编排（课程第 11 课 Compose 规范：services/networks/volumes + healthcheck + depends_on）
# 四容器：Nginx(前端镜像) / API(多阶段构建) / MySQL / MinIO
# 服务器布局：/home/ubuntu/bigtree/
#   ├── server/（后端源码：pom.xml + src/ + Dockerfile + settings.xml，构建 api 镜像用）
#   └── deploy/
#       ├── docker-compose.yml  ├── .env（凭据，不进 git）
#       ├── init.sql（建表脚本，首次起空卷自动执行）  ├── seed.sql（种子数据，手动灌）
#       ├── backup/（滚动备份，backup.sh 由 cron 驱动）
#       └── web/（前端镜像构建上下文：Dockerfile + nginx/default.conf + user/ + admin/ + wallpapers/）
# 启动：docker compose up -d --build   查看：docker compose ps / logs -f api
# 壁纸池不打进前端镜像（数百 MB），仍按卷挂载

name: bigtree

services:
  mysql:
    image: mysql:8.0
    container_name: bt-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=200
      - --innodb-buffer-pool-size=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次起空卷自动建表（已初始化过的卷不会重复执行）
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # 仅本机回环暴露，外部不可直连；本地工具经 SSH 隧道访问（见 deployed/服务器运维速查.md）
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - bt-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # 自建纯 MinIO 镜像（ghcr.io/leehonne000/minio）；大陆服务器拉不动 ghcr 时
    # 用本机 docker save 的 tar 上传后 docker load，标签保持 minio/minio:latest
    image: minio/minio:latest
    container_name: bt-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - minio-data:/data
    # 9000 不对外暴露公网：图片经 Nginx 同域路径 /exam-timeline/ 反代（路线②）
    # 9000/9001 均只绑本机回环，本地工具经 SSH 隧道访问（见 deployed/服务器运维速查.md）
    ports:
      - "127.0.0.1:9000:9000"   # S3 API 仅本机回环
      - "127.0.0.1:9001:9001"   # 控制台仅本机回环
    networks:
      - bt-net

  api:
    build:
      context: ../server        # 多阶段构建（server/Dockerfile：maven 构建 → jre-alpine 运行）
    image: exam-timeline-api:latest
    container_name: bt-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      # 数据库走 Docker 内网；覆盖本地开发的 localhost:3307
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # MinIO 双地址（路线②）：操作走内网，预签名 host 必须是浏览器可达地址
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PRESIGN_ENDPOINT: ${MINIO_PRESIGN_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - bt-net

  nginx:
    build:
      context: ./web            # 前端镜像（web/Dockerfile：dist + nginx.conf 打进镜像）
    image: exam-timeline-web:latest
    container_name: bt-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./web/wallpapers:/usr/share/nginx/html/wallpapers:ro
      - ./web/wallpapers-manifest.json:/usr/share/nginx/html/wallpapers-manifest.json:ro
    networks:
      - bt-net

networks:
  bt-net:
    driver: bridge

volumes:
  mysql-data:
  minio-data:
