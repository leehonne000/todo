# Big Tree Nginx：用户端 / + 后台 /admin/ + API /api/ + 壁纸静态 + MinIO 图片反代
# 45 接口全走 /api 相对路径（前端无需改）；图片预签名走同域 /exam-timeline/（路线②）
server {
    listen 80;
    server_name _;

    client_max_body_size 30m;          # 与后端 multipart 上限对齐
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- MinIO 图片（预签名 GET；签名含 Host，必须原样透传 $host）----
    # ^~ 阻断下方静态扩展名正则，否则 .jpg/.webp 请求会被按用户端 root 解析而 404
    location ^~ /exam-timeline/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- 后端 API（^~ 同理，防止带扩展名的接口路径被静态正则截胡）----
    location ^~ /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- 壁纸（^~ 阻断下方正则，防止图片被按用户端 root 解析）----
    location ^~ /wallpapers/ {
        alias /usr/share/nginx/html/wallpapers/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /wallpapers-manifest.json {
        root /usr/share/nginx/html;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ---- 管理后台（SPA，挂 /admin/ 子路径；^~ 同理阻断正则）----
    location ^~ /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    root /usr/share/nginx/html/user;

    # ---- 用户端静态资源（Vite 产物带 hash，长缓存）----
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---- 用户端（SPA）----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，发版刷新即生效
    location = /index.html {
        add_header Cache-Control "no-store, no-cache";
    }
}
